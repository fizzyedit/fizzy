<!doctype html>
<html lang="en" style="height: 100%;">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fizzy</title>
    <meta name="description" content="fizzy — pixel art editor in your browser." />
    <link rel="icon" type="image/png" href="/img/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #22232a;
        --text: #e6af89;
        --text-muted: #9f9fb0;
        --accent: #2fb387;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-muted);
        font-family: "Noto Sans", system-ui, sans-serif;
      }
      #app-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #dvui-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        caret-color: transparent;
      }
      /* Do not set `display: flex` on [hidden] panels — it overrides the hidden attribute. */
      #loading:not(.is-hidden),
      #error-panel:not([hidden]) {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: var(--bg);
        z-index: 2;
      }
      #loading:not(.is-hidden) {
        pointer-events: none;
      }
      #error-panel:not([hidden]) {
        pointer-events: auto;
      }
      #loading.is-hidden,
      #error-panel[hidden] {
        display: none !important;
      }
      .brand {
        font-family: "Comfortaa", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(28px, 5vw, 40px);
        color: var(--text);
        letter-spacing: -0.02em;
      }
      .status {
        font-size: 15px;
        max-width: 420px;
        line-height: 1.5;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #34363f;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .home-link {
        margin-top: 8px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .home-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body style="height: 100%; margin: 0; padding: 0;">
    <div id="app-root">
      <canvas id="dvui-canvas" tabIndex="1" style="display: block; width: 100%; height: 100%; outline: none; caret-color: transparent;"></canvas>
      <div id="loading" aria-live="polite">
        <div class="brand">fizzy</div>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status" id="loading-status">Loading editor…</p>
      </div>
      <div id="error-panel" role="alert" hidden>
        <div class="brand">fizzy</div>
        <p class="status" id="error-message"></p>
        <a class="home-link" href="/">Back to fizzyed.it</a>
      </div>
    </div>
    <script type="module">
      const loadingEl = document.getElementById("loading");
      const errorPanel = document.getElementById("error-panel");
      const errorMessage = document.getElementById("error-message");

      function hideLoading() {
        loadingEl.classList.add("is-hidden");
      }

      function showError(message) {
        hideLoading();
        errorMessage.textContent = message;
        errorPanel.hidden = false;
      }

      function hasWebGl() {
        const probe = document.createElement("canvas");
        return !!(probe.getContext("webgl2") || probe.getContext("webgl"));
      }

      /** Wait until layout has settled so clientWidth/Height are correct. */
      function waitForLayout() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      // Markdown remote images (and SVG badges) load through the browser: Zig calls
      // `fizzy_web_image_request`. If CORS lets us read pixels, we write RGBA back
      // through `FizzyWebImageAlloc` / `FizzyWebImageReady` and dvui draws them. If
      // it does not — GitHub Actions badges — we keep the `<img>` and Zig parks it
      // over the canvas via `fizzy_web_image_place`. dvui's `web.js` only passes a
      // `dvui` import object into `instantiateStreaming`, so we add a `fizzy`
      // namespace on the way through — same trick as the trackpad export, inverted.
      const utf8 = new TextDecoder();
      const utf8encode = (s) => new TextEncoder().encode(s);
      let wasmInstance = null;
      const overlayUrls = new Map();
      const overlays = new Map();
      // Hide overlays that a canvas frame did not place — not ones that went unseen
      // because the app slept. `frameBegin` is called from Zig at the start of every
      // `dvui_update`; the rAF after paint hides the rest. No frame → no hide, so
      // badges stay when the mouse leaves the window.
      let overlayFrameOpen = false;
      const placedThisFrame = new Set();
      const overlayRoot = document.createElement("div");
      overlayRoot.setAttribute("aria-hidden", "true");
      overlayRoot.style.cssText = "position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;";
      document.getElementById("app-root").appendChild(overlayRoot);

      const origInstantiateStreaming = WebAssembly.instantiateStreaming.bind(WebAssembly);
      WebAssembly.instantiateStreaming = (source, imports) => {
        imports.fizzy = {
          fizzy_web_image_request(id, urlPtr, urlLen) {
            const inst = wasmInstance;
            if (!inst) return;
            const url = utf8.decode(new Uint8Array(inst.exports.memory.buffer, urlPtr, urlLen));
            overlayUrls.set(id, url);
            loadImagePixels(url).then((imageData) => {
              const bytes = new Uint8Array(
                imageData.data.buffer,
                imageData.data.byteOffset,
                imageData.data.byteLength,
              );
              const ptr = inst.exports.FizzyWebImageAlloc(bytes.length);
              if (!ptr) {
                inst.exports.FizzyWebImageFailed(id);
              } else {
                new Uint8Array(inst.exports.memory.buffer, ptr, bytes.length).set(bytes);
                inst.exports.FizzyWebImageReady(id, ptr, bytes.length, imageData.width, imageData.height);
              }
              if (dvuiApp) dvuiApp.requestRender();
            }).catch(() => {
              loadImageSize(url).then(({ w, h }) => {
                inst.exports.FizzyWebImageOverlay(id, w, h);
                if (dvuiApp) dvuiApp.requestRender();
              }).catch(() => {
                inst.exports.FizzyWebImageFailed(id);
                if (dvuiApp) dvuiApp.requestRender();
              });
            });
          },
          fizzy_web_image_frame_begin() {
            overlayFrameOpen = true;
            placedThisFrame.clear();
          },
          fizzy_web_image_place(id, x, y, w, h, cx, cy, cw, ch) {
            const url = overlayUrls.get(id);
            if (!url) return;
            let entry = overlays.get(id);
            if (!entry) {
              const img = document.createElement("img");
              img.alt = "";
              img.draggable = false;
              img.src = url;
              img.style.cssText = "position:absolute;pointer-events:none;";
              overlayRoot.appendChild(img);
              entry = { img };
              overlays.set(id, entry);
            }
            placedThisFrame.add(id);
            const img = entry.img;
            img.style.display = "block";
            img.style.left = x + "px";
            img.style.top = y + "px";
            img.style.width = w + "px";
            img.style.height = h + "px";
            const top = Math.max(0, cy - y);
            const left = Math.max(0, cx - x);
            const bottom = Math.max(0, (y + h) - (cy + ch));
            const right = Math.max(0, (x + w) - (cx + cw));
            img.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px)`;
          },
          fizzy_web_image_dismiss(id) {
            overlayUrls.delete(id);
            const entry = overlays.get(id);
            if (!entry) return;
            entry.img.remove();
            overlays.delete(id);
          },
          // A full request for `core.transport.Web`: any method, headers as `Name: value`
          // lines, a body, and the status back with the bytes. Cloud drives speak through
          // this; `fizzy_web_fetch` below stays the GET-only path the store uses.
          fizzy_web_request(id, methodPtr, methodLen, urlPtr, urlLen, headersPtr, headersLen, bodyPtr, bodyLen) {
            const inst = wasmInstance;
            if (!inst) return;
            const mem = inst.exports.memory.buffer;
            const method = utf8.decode(new Uint8Array(mem, methodPtr, methodLen));
            const url = utf8.decode(new Uint8Array(mem, urlPtr, urlLen));
            const headers = new Headers();
            for (const line of utf8.decode(new Uint8Array(mem, headersPtr, headersLen)).split("\n")) {
              const at = line.indexOf(": ");
              if (at > 0) headers.append(line.slice(0, at), line.slice(at + 2));
            }
            // Copied: the wasm buffer may move before fetch reads it.
            const body = bodyLen > 0 ? new Uint8Array(mem, bodyPtr, bodyLen).slice() : undefined;
            const fail = () => {
              inst.exports.FizzyWebRequestFailed(id);
              if (dvuiApp) dvuiApp.requestRender();
            };
            fetch(url, { method, headers, body, cache: "no-store" }).then((res) => {
              return res.arrayBuffer().then((buf) => {
                const bytes = new Uint8Array(buf);
                const ptr = inst.exports.FizzyWebRequestAlloc(id, bytes.length);
                if (!ptr) return fail();
                if (bytes.length > 0) new Uint8Array(inst.exports.memory.buffer, ptr, bytes.length).set(bytes);
                inst.exports.FizzyWebRequestReady(id, res.status, ptr, bytes.length);
                if (dvuiApp) dvuiApp.requestRender();
              });
            }).catch(fail);
          },
          // A web OAuth round trip for whichever plugin asks (core/transport/WebOAuth.zig): open
          // the provider's URL in a popup and hand back what it redirected to
          // oauth-callback.html with. Provider-agnostic on purpose.
          fizzy_web_oauth_open(urlPtr, urlLen) {
            const inst = wasmInstance;
            if (!inst) return;
            const url = utf8.decode(new Uint8Array(inst.exports.memory.buffer, urlPtr, urlLen));
            const fail = () => {
              inst.exports.FizzyWebOAuthFailed();
              if (dvuiApp) dvuiApp.requestRender();
            };
            let settled = false;
            const onMessage = (ev) => {
              if (ev.origin !== location.origin || !ev.data || typeof ev.data.fizzyOAuth !== "string") return;
              settled = true;
              window.removeEventListener("message", onMessage);
              const bytes = utf8encode(ev.data.fizzyOAuth);
              const ptr = inst.exports.FizzyWebOAuthAlloc(bytes.length);
              if (!ptr) return fail();
              new Uint8Array(inst.exports.memory.buffer, ptr, bytes.length).set(bytes);
              inst.exports.FizzyWebOAuthResult(ptr, bytes.length);
              if (dvuiApp) dvuiApp.requestRender();
            };
            window.addEventListener("message", onMessage);
            const popup = window.open(url, "fizzy-oauth", "popup,width=520,height=680");
            if (!popup) {
              window.removeEventListener("message", onMessage);
              return fail();
            }
            const watch = setInterval(() => {
              if (settled) return clearInterval(watch);
              if (popup.closed) {
                clearInterval(watch);
                window.removeEventListener("message", onMessage);
                fail();
              }
            }, 500);
          },
          fizzy_web_oauth_callback_url(bufPtr, bufLen) {
            const inst = wasmInstance;
            if (!inst) return 0;
            const bytes = utf8encode(location.origin + "/oauth-callback.html");
            if (bytes.length <= bufLen) new Uint8Array(inst.exports.memory.buffer, bufPtr, bytes.length).set(bytes);
            return bytes.length;
          },
          // Byte fetch for the store catalog / READMEs / icons — no rasterize, just GET.
          fizzy_web_fetch(id, urlPtr, urlLen) {
            const inst = wasmInstance;
            if (!inst) return;
            const url = utf8.decode(new Uint8Array(inst.exports.memory.buffer, urlPtr, urlLen));
            fetch(url, { cache: "no-cache" }).then((res) => {
              if (!res.ok) throw new Error("http " + res.status);
              return res.arrayBuffer();
            }).then((buf) => {
              const bytes = new Uint8Array(buf);
              const ptr = inst.exports.FizzyWebFetchAlloc(bytes.length);
              if (!ptr) {
                inst.exports.FizzyWebFetchFailed(id);
              } else {
                new Uint8Array(inst.exports.memory.buffer, ptr, bytes.length).set(bytes);
                inst.exports.FizzyWebFetchReady(id, ptr, bytes.length);
              }
              if (dvuiApp) dvuiApp.requestRender();
            }).catch(() => {
              inst.exports.FizzyWebFetchFailed(id);
              if (dvuiApp) dvuiApp.requestRender();
            });
          },
        };
        return origInstantiateStreaming(source, imports).then((result) => {
          wasmInstance = result.instance;
          return result;
        });
      };

      function hideUnplacedOverlays() {
        if (overlayFrameOpen) {
          for (const [id, entry] of overlays) {
            if (!placedThisFrame.has(id)) entry.img.style.display = "none";
          }
          overlayFrameOpen = false;
        }
        requestAnimationFrame(hideUnplacedOverlays);
      }
      requestAnimationFrame(hideUnplacedOverlays);

      /** Rasterize `url` the way an `<img>` would — PNG/JPEG and CORS-friendly SVG. */
      function loadImagePixels(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            if (!(w > 0) || !(h > 0) || w * h > 4 * 1024 * 1024) {
              reject(new Error("empty or oversized image"));
              return;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            try {
              resolve(ctx.getImageData(0, 0, w, h));
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = () => reject(new Error("image load failed"));
          img.src = url;
        });
      }

      /** Load without CORS so we still get intrinsic size for an overlay. */
      function loadImageSize(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
          img.onerror = () => reject(new Error("image load failed"));
          img.src = url;
        });
      }

      // Trackpad pinch arrives as a `wheel` event with `ctrlKey=true` and `deltaMode=0`
      // (every modern browser synthesizes this). Two things to do here in the capture phase,
      // before dvui's bubble-phase listener on the canvas:
      //   1. preventDefault + stopImmediatePropagation — keeps the browser from page-zooming
      //      and keeps dvui's wheel handler from folding the tiny pinch delta into its
      //      `scroll_lowest` minimum (an all-time min that never resets and otherwise
      //      poisons trackpad scroll sensitivity for the rest of the session).
      //   2. Forward the magnification into the wasm trackpad accumulator
      //      (`FizzyWebTrackpadMagnification`). The canvas widget drains it each frame and
      //      applies the same scale-around-point math used by macOS native pinch.
      // `dvuiApp` starts null and is filled in once the app loads — events that arrive
      // before then are still safely suppressed.
      // Scale factor (100): browser pinch deltaY is roughly ±1..±20 per event; dividing by
      // 100 produces ratios around 1.01..1.2 per event, matching the magnitude AppKit
      // reports for native trackpad gestures. Negate deltaY because positive deltaY means
      // "pinch fingers together = zoom out".
      let dvuiApp = null;
      const dvuiCanvas = document.getElementById("dvui-canvas");
      dvuiCanvas.addEventListener("wheel", (ev) => {
        if (ev.ctrlKey && ev.deltaMode === 0) {
          ev.preventDefault();
          ev.stopImmediatePropagation();
          if (dvuiApp && dvuiApp.instance.exports.FizzyWebTrackpadMagnification) {
            dvuiApp.instance.exports.FizzyWebTrackpadMagnification(-ev.deltaY / 100);
            // dvui normally calls `requestRender` from its own wheel listener — since we
            // swallowed the event in the capture phase, drive the frame loop ourselves so
            // the canvas widget actually drains the accumulator we just wrote.
            dvuiApp.requestRender();
          }
        }
      }, { capture: true, passive: false });

      if (!hasWebGl()) {
        showError("This browser does not support WebGL, which fizzy needs to run.");
      } else {
        const wasmUrl = "web.wasm?cache-buster=TEMPLATE_HASH_WITH_PADDING__ITS_64_BYTES_LONG_THE_SAME_AS_SHA256";
        waitForLayout()
          .then(() => import("./web.js?cache-buster=TEMPLATE_HASH_WITH_PADDING__ITS_64_BYTES_LONG_THE_SAME_AS_SHA256"))
          .then(({ dvui }) => dvui("#dvui-canvas", wasmUrl))
          .then((app) => {
            // Late-bind the app reference so the capture-phase wheel listener above can
            // forward pinch deltas into the trackpad accumulator and kick a render.
            dvuiApp = app;
            window.dispatchEvent(new Event("resize"));
            app.requestRender();
            hideLoading();
          })
          .catch((err) => {
            console.error(err);
            const detail = err instanceof Error ? err.message : String(err);
            showError(`Failed to load the editor (${detail}). Try a hard refresh, or use a recent Chrome, Firefox, or Safari.`);
          });
      }
    </script>
  </body>
</html>
