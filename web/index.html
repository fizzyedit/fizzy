<!doctype html>
<html lang="en" style="height: 100%;">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#22232a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>fizzy</title>
    <meta name="description" content="fizzy — pixel art editor in your browser." />
    <link rel="icon" type="image/png" href="/img/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #22232a;
        --text: #e6af89;
        --text-muted: #9f9fb0;
        --accent: #2fb387;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        /* The app bands its own scroll ends; the browser's pull-to-refresh and glow must not run beside it. */
        overscroll-behavior: none;
        background: var(--bg);
        color: var(--text-muted);
        font-family: "Noto Sans", system-ui, sans-serif;
      }
      #app-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* viewport-fit=cover lets the page run under a notch or home bar in fullscreen and an
           installed app; keep the editor out of them. Zero everywhere else. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #dvui-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        caret-color: transparent;
      }
      /* Do not set `display: flex` on [hidden] panels — it overrides the hidden attribute. */
      #loading:not(.is-hidden),
      #error-panel:not([hidden]) {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: var(--bg);
        z-index: 2;
      }
      #loading:not(.is-hidden) {
        pointer-events: none;
      }
      #error-panel:not([hidden]) {
        pointer-events: auto;
      }
      #loading.is-hidden,
      #error-panel[hidden] {
        display: none !important;
      }
      .brand {
        font-family: "Comfortaa", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(28px, 5vw, 40px);
        color: var(--text);
        letter-spacing: -0.02em;
      }
      .status {
        font-size: 15px;
        max-width: 420px;
        line-height: 1.5;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #34363f;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .home-link {
        margin-top: 8px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .home-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body style="height: 100%; margin: 0; padding: 0;">
    <div id="app-root">
      <canvas id="dvui-canvas" tabIndex="1" style="display: block; width: 100%; height: 100%; outline: none; caret-color: transparent;"></canvas>
      <div id="loading" aria-live="polite">
        <div class="brand">fizzy</div>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status" id="loading-status">Loading editor…</p>
      </div>
      <div id="error-panel" role="alert" hidden>
        <div class="brand">fizzy</div>
        <p class="status" id="error-message"></p>
        <a class="home-link" href="/">Back to fizzyed.it</a>
      </div>
    </div>
    <script type="module">
      import { Fizzy } from "./fizzy.js?cache-buster=TEMPLATE_HASH_WITH_PADDING__ITS_64_BYTES_LONG_THE_SAME_AS_SHA256";

      const loading = document.getElementById("loading");
      const errorPanel = document.getElementById("error-panel");
      const errorMessage = document.getElementById("error-message");
      const hideLoading = () => loading.classList.add("is-hidden");
      const showError = (message) => {
        hideLoading();
        errorMessage.textContent = message;
        errorPanel.hidden = false;
      };

      // `?storage=<name>`: an embed's own storage. `?persist=0`: keep nothing past the page.
      // `?worker=1|0`: the editor in a worker or not. `?form=mobile|tablet|desktop` (`phone` is
      // `mobile`): for this visit only, never stored. `?plugin=<id>`, `?open=<url>`,
      // `&show=<path>`, `?demo=<name or url>`, `?tape=<url>`: what to load, open and play.
      const params = new URLSearchParams(location.search);
      const worker = params.get("worker");
      const form = params.get("form");
      const options = {
        canvas: document.getElementById("dvui-canvas"),
        storage: params.get("storage") ?? undefined,
        persist: params.get("persist") !== "0",
        worker: worker === "1" ? true : worker === "0" ? false : undefined,
        form: form === "phone" ? "mobile" : form ?? undefined,
        glassBench: params.get("glass_bench") ?? undefined,
        glassRepeat: params.get("glass_repeat") ?? undefined,
        plugins: params.getAll("plugin"),
        open: params.getAll("open"),
        show: params.get("show") ?? undefined,
        demos: params.getAll("demo"),
        tape: params.get("tape") ?? undefined,
        onReady: hideLoading,
        onError: showError,
      };
      try {
        new Fizzy(options).run();
      } catch (err) {
        console.error(err);
        showError(err.message);
      }
    </script>
  </body>
</html>
