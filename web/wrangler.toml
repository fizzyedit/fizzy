# Deploy fizzy's plugin download and image proxy (see `dl-worker.js` for what it is and why).
#
#   npx wrangler deploy --config web/wrangler.toml
#
# Nothing else is needed: no KV, no secrets, no build step.
name = "fizzy-plugin-dl"
main = "dl-worker.js"
compatibility_date = "2026-09-01"

# Served from the custom domain `dl.fizzyed.it`. The `fizzyed.it` zone's other records are
# DNS-only (not proxied), so a route on `fizzyed.it/dl/*` would never fire; a Workers Custom
# Domain makes Cloudflare create the proxied record for this one hostname. The page checks the
# sha256 the registry published before it compiles anything, so the proxy is never trusted.
routes = [
  { pattern = "dl.fizzyed.it", custom_domain = true },
]

# Kept on for now: pages cached before the move still point at the workers.dev URL, and turning
# it off would break their plugin installs. Set it to false (and redeploy) once they have aged out.
workers_dev = true
