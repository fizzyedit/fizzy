# The web app for fizzyed.it, built here and handed to fizzyedit/website to publish. Two copies:
#
# - **fizzyed.it/testapp/ is `main`**, every push. What is being built right now, an SDK change
#   included: try a new SDK there while plugins catch up. It files its browser storage under a
#   name of its own (`-Dweb-storage=fizzy-testapp`), so it never reads or overwrites the real
#   app's settings, layout or plugins.
# - **fizzyed.it/app/ is the live SDK release**, the one the store's plugins are built for, so
#   every plugin loads there. It goes up from a push to `main` only while `main`'s plugin SDK
#   fingerprint is the live one. After an `sdk` merge it holds its last build until that SDK goes
#   live.
#
# **Going live** is a person's step, once the plugins have repinned and released into the new SDK
# (`CONTRIBUTING.md`, "Changing the SDK"): run this workflow on main with `go_live` set to an SDK version
# (`gh workflow run web.yml --ref main -f go_live=0.2.27`). It moves the `web-live` tag to that
# `sdk-v*` release and puts the app up: from `main` when `main` is on that SDK, else from the
# release's own commit, so the app is always a clean release.
#
# Each copy goes to a release in fizzyedit/website (`web-main` for the app, `web-preview` for the
# test copy), its zip replaced every time, and the website is asked to redeploy. Pull requests
# publish nothing: ci.yml compiles them for the web (`check-web`).
#
# A release published here asks for a redeploy too, without a build: the site links releases.
#
# Needs the secret WEBSITE_DISPATCH_TOKEN: a fine-grained token with Contents read/write on
# fizzyedit/website, for the release upload and the dispatch.

name: Web

on:
  push:
    branches: [main]
    paths:
      # Everything the web app is built from, not just fizzy's own source: `app/`, `core/`,
      # `sdk/` and the bundled `plugins/` all compile into it, and a change confined to one of
      # them used to leave fizzyed.it/app serving the previous build with no sign anything was
      # missing.
      - "src/**"
      - "app/**"
      - "core/**"
      - "sdk/**"
      - "plugins/**"
      - "build/**"
      - "build.zig"
      - "build.zig.zon"
      - "web/**"
      - ".github/workflows/web.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      go_live:
        description: "Make this SDK version live on fizzyed.it/app, e.g. 0.2.27 (empty: just rebuild)"
        required: false
        default: ""

env:
  ZIG_VERSION: "0.16.0"
  WEBSITE: fizzyedit/website

jobs:
  # What this run publishes, and from which commit: the test copy from main, always; the app from
  # a commit on the live SDK, or not at all.
  plan:
    if: github.event_name != 'release'
    permissions:
      # To move the `web-live` tag when going live.
      contents: write
    runs-on: ubuntu-latest
    outputs:
      copies: ${{ steps.plan.outputs.copies }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Go live
        if: inputs.go_live != ''
        env:
          VERSION: ${{ inputs.go_live }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Go live from main: gh workflow run web.yml --ref main -f go_live=$VERSION"; exit 1
          fi
          tag="sdk-v$VERSION"
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || { echo "::error::No release $tag."; exit 1; }
          git tag -f web-live "$tag^{commit}"
          git push -f origin refs/tags/web-live
          echo "fizzyed.it/app goes live on $tag."

      - name: Plan the copies
        id: plan
        run: |
          fingerprint() { grep -oE 'recorded_sdk_shape_fingerprint: u64 = 0x[0-9a-fA-F]+' | grep -oE '0x[0-9a-fA-F]+'; }
          here=$(fingerprint < sdk/src/version.zig)
          live=$(git show web-live:sdk/src/version.zig 2>/dev/null | fingerprint || true)
          copies='[{"channel":"testapp","release":"web-preview","storage":"fizzy-testapp","ref":"'"$GITHUB_SHA"'"}'
          if [ -n "$live" ] && [ "$here" = "$live" ]; then
            echo "main is on the live plugin SDK ($live): the app goes up from it."
            copies="$copies"',{"channel":"app","release":"web-main","storage":"fizzy","ref":"'"$GITHUB_SHA"'"}'
          elif [ -n "${{ inputs.go_live }}" ]; then
            ref=$(git rev-parse 'web-live^{commit}')
            echo "main has moved past the live SDK: the app goes up from its release commit ($ref)."
            copies="$copies"',{"channel":"app","release":"web-main","storage":"fizzy","ref":"'"$ref"'"}'
          else
            why="main's plugin SDK fingerprint ($here) is not the live one (\`web-live\`: ${live:-no tag yet})"
            echo "::notice title=fizzyed.it/app held::$why. It goes up when that SDK goes live (go_live)."
            printf '### fizzyed.it/app held\n\n%s. Store plugins are built for the live SDK; the app keeps its last build and goes up when the new SDK goes live (`gh workflow run web.yml --ref main -f go_live=<version>`). fizzyed.it/testapp has this commit.\n' "$why" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "copies=$copies]" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.copies) }}
    # No concurrency group: every build runs to its end; only the newest of a copy publishes
    # ("Is this the newest build?"), so a superseded one never overwrites a newer one.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      # The Zig cache as in ci.yml's test job: a fixed key, one cold build saved once. setup-zig's
      # own cache saved a new copy every run.
      - name: Zig cache key
        id: zig-cache-key
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-web-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
      # As in ci.yml: leave setup-zig's cache dirs alone, pre-fetch in a retry loop, and retry
      # the build itself only on a fetch failure (a lazy dependency is fetched by the build).
      - name: Pre-create Zig cache tmp/
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        run: bash scripts/ci-retry.sh zig build --fetch

      # ReleaseSmall, and the class matters more than the size. Fizzy folds an optimize *safety
      # class* into its plugin ABI fingerprint — Debug/ReleaseSafe are "safe", ReleaseFast and
      # ReleaseSmall are "fast" — and the plugin store publishes "fast" builds only. Built
      # ReleaseSafe, the app asks the registry for a shard nobody publishes under, so every
      # plugin in a healthy store reads "No store build" and nothing can be installed.
      - name: Build web app
        run: bash scripts/ci-retry.sh zig build web -Doptimize=ReleaseSmall -Dweb-storage="${{ matrix.storage }}"

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

      # What was built, beside it: fizzyed.it/app/build.json and testapp/build.json say which
      # commit is up.
      - name: Note the build
        env:
          SHA: ${{ matrix.ref }}
        run: |
          printf '{"channel":"%s","sha":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$CHANNEL" "$SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > zig-out/web/build.json
          cat zig-out/web/build.json
          (cd zig-out/web && zip -qr "$GITHUB_WORKSPACE/web.zip" .)

      # Newer runs of this workflow that build this copy and have not failed: still running, or
      # done. One of those publishes, so this one does not. A newer one that then fails leaves the copy before it served; the next push
      # builds again.
      - name: Is this the newest build?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/web.yml/runs?per_page=50" --jq "
            .workflow_runs[]
            | select(.id != $GITHUB_RUN_ID and .created_at > \"$mine\" and .event != \"release\")
            | select(.conclusion == null or .conclusion == \"success\")
            | .id")
          newer=""
          for id in $runs; do
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"build $CHANNEL\" and .conclusion != \"skipped\" and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
            if [ "$live" != "0" ]; then newer="$id"; break; fi
          done
          if [ -n "$newer" ]; then
            echo "A newer $CHANNEL build is on its way ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$newer): this one does not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the build to the website
        if: steps.newest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE: ${{ matrix.release }}
          SHA: ${{ matrix.ref }}
        run: |
          if [ "$CHANNEL" = app ]; then
            notes="The app at https://fizzyed.it/app/, the live plugin SDK, built from $GITHUB_REPOSITORY@$SHA"
          else
            notes="main, at https://fizzyed.it/testapp/, built from $GITHUB_REPOSITORY@$SHA"
          fi
          if ! gh release view "$RELEASE" --repo "$WEBSITE" > /dev/null 2>&1; then
            gh release create "$RELEASE" --repo "$WEBSITE" --prerelease --title "$RELEASE" --notes "$notes"
          fi
          gh release upload "$RELEASE" web.zip --clobber --repo "$WEBSITE"
          gh release edit "$RELEASE" --repo "$WEBSITE" --notes "$notes"
          gh api "repos/$WEBSITE/dispatches" -f event_type=fizzy-updated

  # A published release changes what the site links, not the app.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Ask fizzyedit/website to redeploy
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh api "repos/$WEBSITE/dispatches" -f event_type=fizzy-updated
