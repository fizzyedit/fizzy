# The web app for fizzyed.it, built here and handed to fizzyedit/website to publish.
#
# Pushed to main, it is the real app, fizzyed.it/app/. Built for a pull request — or run by hand
# on any branch but main — it is a test copy, fizzyed.it/testapp/, filing its browser storage under
# a name of its own (`-Dweb-storage`) so it never reads or overwrites the real app's settings,
# layout or plugins. Each build goes to a release in fizzyedit/website — `web-main` or
# `web-preview`, its zip replaced every time — and the website is asked to redeploy, taking the
# latest of each. There is one test copy: the last build for any pull request is the one served.
#
# A pull request from a fork builds nothing. The test copy is served from fizzyed.it itself, so
# a fork's code must not be published there unreviewed (and a fork's run gets no secrets anyway).
#
# Nor does a draft pull request: it can run CI (ci.yml) without taking the one test copy from
# whichever pull request has it. Marked ready for review, it builds and is served like any other.
#
# **The real app goes up only on a released plugin SDK.** Store plugins are built against the
# released `sdk-v*` tarballs, and the app loads only those whose fingerprint matches its own. So a
# push to main whose recorded fingerprint differs from the one at its `sdk-v<sdk_version>` tag (an
# `sdk` pull request merged, its release not out yet) still builds, but does not publish: the site
# keeps the last build every store plugin loads in, and the run says why. Publishing the release
# (sdk-tag.yml) starts this workflow on main, which then goes up. The test copy is not held.
#
# A release published here asks for a redeploy too, without a build: the site links releases.
#
# Needs the secret WEBSITE_DISPATCH_TOKEN: a fine-grained token with Contents read/write on
# fizzyedit/website, for the release upload and the dispatch.

name: Web

on:
  push:
    branches: [main]
    paths:
      # Everything the web app is built from, not just fizzy's own source: `app/`, `core/`,
      # `sdk/` and the bundled `plugins/` all compile into it, and a change confined to one of
      # them used to leave fizzyed.it/app serving the previous build with no sign anything was
      # missing.
      - "src/**"
      - "app/**"
      - "core/**"
      - "sdk/**"
      - "plugins/**"
      - "build/**"
      - "build.zig"
      - "build.zig.zon"
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    # The default three, and `ready_for_review` for a draft's first build.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "app/**"
      - "core/**"
      - "sdk/**"
      - "plugins/**"
      - "build/**"
      - "build.zig"
      - "build.zig.zon"
      - "web/**"
      - ".github/workflows/web.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"
  WEBSITE: fizzyedit/website
  # `main` for the real app, `preview` for the test copy.
  CHANNEL: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && 'preview' || 'main' }}

jobs:
  build:
    if: >-
      github.event_name != 'release' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    # No concurrency group: one build cancelling another left a red X on whichever pull request's
    # commit it cancelled (GitHub counts a cancelled check as failed), for nothing that was wrong
    # with it. Every build runs to its end and passes; only the newest of a channel publishes
    # ("Is this the newest build?"), so a superseded one still never overwrites a newer one.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in ci.yml's test job: a fixed key, one cold build saved once, a pull
      # request falling back to main's. setup-zig's own cache saved a new copy every run.
      - name: Zig cache key
        id: zig-cache-key
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-web-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      # As in ci.yml: leave setup-zig's cache dirs alone, pre-fetch in a retry loop, and retry
      # the build itself only on a fetch failure (a lazy dependency is fetched by the build).
      - name: Pre-create Zig cache tmp/
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        run: bash scripts/ci-retry.sh zig build --fetch

      # ReleaseSmall, and the class matters more than the size. Fizzy folds an optimize *safety
      # class* into its plugin ABI fingerprint — Debug/ReleaseSafe are "safe", ReleaseFast and
      # ReleaseSmall are "fast" — and the plugin store publishes "fast" builds only. Built
      # ReleaseSafe, the app asks the registry for a shard nobody publishes under, so every
      # plugin in a healthy store reads "No store build" and nothing can be installed.
      - name: Build web app
        run: |
          storage=fizzy
          if [ "$CHANNEL" = preview ]; then storage=fizzy-testapp; fi
          bash scripts/ci-retry.sh zig build web -Doptimize=ReleaseSmall -Dweb-storage="$storage"

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

      # What was built, beside it: fizzyed.it/testapp/build.json says which commit is up.
      - name: Note the build
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          printf '{"channel":"%s","ref":"%s","sha":"%s","pr":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$CHANNEL" "$REF" "$SHA" "$PR" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > zig-out/web/build.json
          cat zig-out/web/build.json
          (cd zig-out/web && zip -qr "$GITHUB_WORKSPACE/web.zip" .)

      # The real app on an SDK no store plugin is built for loads none of them: hold it until the
      # release is out (see the top of this file). The tag is fetched alone, as the checkout is
      # shallow.
      - name: Is its plugin SDK released?
        id: released
        if: env.CHANNEL == 'main'
        run: |
          block=$(awk '/pub const sdk_version = std\.SemanticVersion\{/,/\};/' sdk/sdk_version.zig)
          version=$(for f in major minor patch; do grep -oE "\.$f = [0-9]+" <<<"$block" | grep -oE '[0-9]+'; done | paste -sd. -)
          tag="sdk-v$version"
          fingerprint() { grep -oE 'recorded_sdk_shape_fingerprint: u64 = 0x[0-9a-fA-F]+' | grep -oE '0x[0-9a-fA-F]+'; }
          here=$(fingerprint < sdk/src/version.zig)
          if git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            released=$(git show "$tag:sdk/src/version.zig" | fingerprint)
          else
            released=""
          fi
          if [ -n "$here" ] && [ "$here" = "$released" ]; then
            echo "Plugin SDK $tag is released with this fingerprint ($here): the app goes up."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            why="this commit's plugin SDK fingerprint ($here) is not released (\`$tag\`: ${released:-no such tag yet})"
            echo "::notice title=fizzyed.it/app held::Not published: $why. It goes up when that release is out."
            printf '### fizzyed.it/app held\n\nNot published: %s. Store plugins would not load in it; the site keeps its last build. It goes up when the release is out (sdk-tag.yml starts this workflow on main).\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Newer runs of this workflow for the same channel whose build has not been skipped (a
      # draft's) and has not failed: still running, or done. One of those publishes, so this one
      # does not. A newer one that then fails leaves the copy before it served; the next push
      # builds again.
      - name: Is this the newest build?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/web.yml/runs?per_page=50" --jq "
            .workflow_runs[]
            | select(.id != $GITHUB_RUN_ID and .created_at > \"$mine\" and .event != \"release\")
            | select((if (.event == \"pull_request\" or .head_branch != \"main\") then \"preview\" else \"main\" end) == \"$CHANNEL\")
            | select(.conclusion == null or .conclusion == \"success\")
            | .id")
          newer=""
          for id in $runs; do
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion != "skipped" and .conclusion != "failure" and .conclusion != "cancelled")] | length')
            if [ "$live" != "0" ]; then newer="$id"; break; fi
          done
          if [ -n "$newer" ]; then
            echo "A newer $CHANNEL build is on its way ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$newer): this one does not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the build to the website
        if: steps.newest.outputs.publish == 'true' && steps.released.outputs.released != 'false'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          tag="web-$CHANNEL"
          if [ -n "$PR" ]; then
            notes="Test build of $GITHUB_REPOSITORY#$PR ($REF @ $SHA), served at https://fizzyed.it/testapp/"
          elif [ "$CHANNEL" = preview ]; then
            notes="Test build of $REF @ $SHA, served at https://fizzyed.it/testapp/"
          else
            notes="The app at https://fizzyed.it/app/, built from $GITHUB_REPOSITORY@$SHA"
          fi
          if ! gh release view "$tag" --repo "$WEBSITE" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$WEBSITE" --prerelease --title "$tag" --notes "$notes"
          fi
          gh release upload "$tag" web.zip --clobber --repo "$WEBSITE"
          gh release edit "$tag" --repo "$WEBSITE" --notes "$notes"
          gh api "repos/$WEBSITE/dispatches" -f event_type=fizzy-updated

  # A published release changes what the site links, not the app.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Ask fizzyedit/website to redeploy
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh api "repos/$WEBSITE/dispatches" -f event_type=fizzy-updated
