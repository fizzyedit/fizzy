name: SDK tag

# Auto-pins the plugin ABI contract: on every push to main, if sdk/sdk_version.zig's
# `sdk_version` doesn't already have a matching `sdk-v<major>.<minor>.<patch>` tag, create and
# push one at this commit. Then pack the plugin-facing `sdk/` package (plus vendored
# `core` + `sdk/src`) into `fizzy-sdk-v*.tar.gz` and publish it as a GitHub release asset
# on that tag — the URL third-party plugins pin (docs/PLUGINS.md §2.3). The git archive of the
# monorepo is *not* a valid plugin pin: its root zon owns Velopack.
#
# `sdk-v*` is a separate namespace from the app's `v*` release tags (release.yml triggers on
# `tags: ["v*"]`, a glob on the ref's start — `sdk-v...` doesn't start with `v`, so this can
# never fire the app build/package pipeline).
#
# A released tarball is never replaced. Plugins pin it by hash, so packing a later `main` into an
# existing tag's release breaks every one of them on a clean fetch — which is what happened to
# `sdk-v0.2.15`, repacked from #207's merge two days after it shipped. A push that leaves
# `sdk_version` alone therefore publishes nothing. The one exception is a release whose tarball
# is missing (a run that failed after pushing the tag): it is packed from the tag's own commit.

on:
  push:
    branches: [main]
    paths:
      - "sdk/src/version.zig"
      - "sdk/**"
      - "scripts/pack-sdk.sh"
      - ".github/workflows/sdk-tag.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute sdk_version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          block=$(awk '/pub const sdk_version = std\.SemanticVersion\{/,/\};/' sdk/sdk_version.zig)
          major=$(grep -oE '\.major = [0-9]+' <<<"$block" | grep -oE '[0-9]+')
          minor=$(grep -oE '\.minor = [0-9]+' <<<"$block" | grep -oE '[0-9]+')
          patch=$(grep -oE '\.patch = [0-9]+' <<<"$block" | grep -oE '[0-9]+')

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "Failed to parse sdk_version out of sdk/sdk_version.zig" >&2
            exit 1
          fi

          tag="sdk-v${major}.${minor}.${patch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Resolved sdk_version -> $tag"

      - name: Create tag if missing
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          asset="fizzy-sdk-v${{ steps.ver.outputs.version }}.tar.gz"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$asset"; then
              echo "Tag $tag and its $asset already exist: nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $tag exists without $asset: packing it from the tag's own commit."
            git checkout -q "$tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "SDK ${{ steps.ver.outputs.version }} (plugin pin + ABI fingerprint)"
          git push origin "$tag"
          echo "Pushed $tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build changelog since previous SDK tag
        if: steps.tag.outputs.publish == 'true'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"

          # Newest sdk-v* tag (other than this one) that is an ancestor of HEAD.
          prev=""
          while read -r t; do
            [[ "$t" == "$tag" ]] && continue
            if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
              prev="$t"
              break
            fi
          done < <(git tag --list 'sdk-v*' --sort=-v:refname)

          out="${RUNNER_TEMP:-/tmp}/CHANGELOG_SDK.md"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          if [[ -z "$prev" ]]; then
            printf '## Changes\n\nFirst published SDK release — no previous `sdk-v*` tag to diff against.\n' >"$out"
            echo "No previous SDK tag found."
          else
            range="${prev}..HEAD"
            echo "Changelog range: $range"
            printf '## Changes since `%s`\n\n' "$prev" >"$out"

            sdk_log=$(git log "$range" --no-merges --format='- %s (%h)' -- sdk sdk/src scripts/pack-sdk.sh)
            if [[ -n "$sdk_log" ]]; then
              printf '### SDK\n\n%s\n\n' "$sdk_log" >>"$out"
            fi

            all_log=$(git log "$range" --no-merges --format='- %s (%h)')
            if [[ -n "$all_log" ]]; then
              printf '<details>\n<summary>All commits in this range</summary>\n\n%s\n\n</details>\n\n' "$all_log" >>"$out"
            fi

            printf '[Full diff](https://github.com/%s/compare/%s...%s)\n' \
              "${{ github.repository }}" "$prev" "$tag" >>"$out"
          fi

          cat "$out"

      - name: Pack SDK tarball
        if: steps.tag.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/pack-sdk.sh
          ./scripts/pack-sdk.sh "$PWD/zig-out/sdk"
          ls -la zig-out/sdk/

      - name: Publish GitHub release asset
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          asset="zig-out/sdk/fizzy-sdk-v${version}.tar.gz"
          test -f "$asset"

          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          Plugin-facing SDK package for Fizzy \`${version}\`.

          Pin in your plugin's \`build.zig.zon\`:

          \`\`\`zig
          .fizzy = .{
              .url = "https://github.com/fizzyedit/fizzy/releases/download/${tag}/fizzy-sdk-v${version}.tar.gz",
              .hash = "…",
          },
          \`\`\`

          \`\`\`
          zig fetch --save=fizzy https://github.com/fizzyedit/fizzy/releases/download/${tag}/fizzy-sdk-v${version}.tar.gz
          \`\`\`

          Do **not** pin the git archive of this tag — that is the full monorepo (app zon / Velopack).
          This asset is the \`sdk/\` package with \`core\` + \`sdk/src\` vendored in.
          Locally, \`.path = "../fizzy/sdk"\` is fine while developing against an unreleased SDK.

          See [docs/PLUGINS.md](https://github.com/fizzyedit/fizzy/blob/main/docs/PLUGINS.md) §2.3.
          EOF
          # Strip the common leading indent from the YAML-embedded heredoc.
          sed -i 's/^          //' "$notes_file"

          # Append the commit changelog computed against the previous sdk-v* tag.
          printf '\n---\n\n' >>"$notes_file"
          cat "${{ steps.changelog.outputs.file }}" >>"$notes_file"

          # A release that exists here is one without its tarball (the tag step stops otherwise).
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists without its tarball — uploading it and refreshing notes."
            gh release upload "$tag" "$asset"
            gh release edit "$tag" --notes-file "$notes_file"
          else
            # Never GitHub's "latest": that is the app's newest `v*` release, and
            # `releases/latest/download/fizzy_<os>_<arch>…` (fizzyed.it's download buttons)
            # resolves against it. An SDK release carries only the tarball, so as "latest" it
            # turned every app download into a 404.
            gh release create "$tag" "$asset" \
              --title "Fizzy SDK $version" \
              --notes-file "$notes_file" \
              --latest=false
          fi

          echo "Published $asset on $tag"
          gh release view "$tag" --json assets --jq '.assets[].name'

      # Each fizzyedit plugin in the store registry (fizzyedit/plugins, by its homepage) repins
      # itself: its sdk-repin.yml runs plugin-build-action's repin.yml, which builds it against
      # this SDK and opens a PR when the plugin needs a release (its fingerprint moved, or it no
      # longer builds). Nothing here tags a plugin.
      #
      # `repository_dispatch` needs PLUGIN_DISPATCH_TOKEN: a fine-grained token on the fizzyedit
      # organization with Contents read/write on the plugin repos. Without it this warns, and a
      # plugin can still be repinned by hand (`gh workflow run sdk-repin.yml --repo fizzyedit/<id>`).
      - name: Ask the store plugins to repin
        if: steps.tag.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PLUGIN_DISPATCH_TOKEN is not set: no plugin was asked to repin to $VERSION"
            exit 0
          fi
          # The registry is public: read it with this run's own token.
          if ! names=$(GH_TOKEN="$READ_TOKEN" gh api repos/fizzyedit/plugins/contents/registry \
              --jq '.[] | select(.name | endswith(".json")) | .name'); then
            echo "::warning::could not read fizzyedit/plugins' registry: no plugin was asked to repin to $VERSION"
            exit 0
          fi
          repos=""
          for name in $names; do
            homepage=$(GH_TOKEN="$READ_TOKEN" gh api "repos/fizzyedit/plugins/contents/registry/$name" \
              --jq '.content | @base64d | fromjson | .homepage // ""')
            case "$homepage" in
              https://github.com/fizzyedit/*) repo=${homepage#https://github.com/fizzyedit/}; repos="$repos ${repo%/}" ;;
            esac
          done
          for repo in $repos; do
            if gh api "repos/fizzyedit/$repo/dispatches" -f event_type=fizzy-sdk-release \
                -f "client_payload[version]=$VERSION" >/dev/null; then
              echo "asked fizzyedit/$repo to repin to $VERSION"
            else
              echo "::warning::could not ask fizzyedit/$repo to repin (is sdk-repin.yml there, and the token scoped to it?)"
            fi
          done
