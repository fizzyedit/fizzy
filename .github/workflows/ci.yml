name: CI

# Every run, a push to main included: three native test jobs (no skipped rows), the example
# repos, the integration tests, a verdict run and the Windows cross-build, side by side.
#
# `ci-ok` is the one check `main`'s ruleset requires (`.github/rulesets/main.json`), so the
# workflow runs for every change. A workflow-level `paths-ignore` would never start for a
# Markdown-only PR, leaving its required check waiting for good; `changes` works out instead
# whether anything besides docs changed, and the builds skip themselves when nothing did.
#
# A push to main runs the full matrix because main's runs are the only ones whose Zig caches
# every pull request can restore: a cache a pull request saves is visible to that pull request
# alone (see the test job's "Restore Zig cache"). Pushes used to run only the Linux jobs, so main
# held no macOS, Windows or cross-build cache and every pull request's first run built those
# three cold. Now the merge that changes a dependency saves the new caches, a cache GitHub
# evicted after a quiet week comes back on the next merge, and every merge is tested on all
# three platforms. Nothing waits on a main run, and a cache hit makes the extra jobs short.
#
# A draft pull request runs only `changes`: its author ran the gates on their own machine, and a
# draft decides nothing, so the matrix would only repeat that. The matrix runs once per push to a
# ready pull request, and `ready_for_review` starts it for the push the draft already holds.
# `changes` reports code=false and sdl=false for a draft; all other jobs, including
# `ci-ok`, skip; `gh pr ready` is therefore what makes the required check mean something, and
# `main`'s ruleset still requires it. Pushes to main and the merge queue are unchanged.
#
# A skipped `ci-ok` is safe only on a draft: a draft cannot be merged, and the merge queue
# reruns the whole matrix on the `merge_group` ref. Turning a ready PR back into a draft is
# not a trigger, so its last full result stays on it; push or mark it ready again for a fresh one.
#
# The Zig compiler is restored from the Actions cache by every job: setup-zig keeps the verified
# tarball under the key `setup-zig-tarball-<tarball name>` (the version is pinned by ZIG_VERSION;
# a job's log shows `Cache hit for: setup-zig-tarball-zig-x86_64-linux-0.17.0`),
# independent of the `use-cache: false` the jobs set for the Zig *package* cache, which has the
# per-job key `zig-<ZIG_VERSION>-<job>-<os>-<arch>-<hash of every build.zig.zon>`.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

# A pull request's newer push cancels its older run: only the head is merged. A push to main is
# never cancelled, because each one is a merge that belongs in main's history: its group is the
# commit, so merges landing minutes apart each run to the end. When main's group was the branch,
# every merge cancelled the one before. Each cancelled commit read as failed: GitHub counts a
# cancelled check as a failure, and `ci-ok` (`if: always()`) fails on cancelled jobs. And a break
# between two PRs that merged close together showed only at the later commit, never the one that
# caused it. Two main runs overlapping is harmless: both restore the same caches, and the second
# to save a key only gets a warning.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      sdl: ${{ steps.filter.outputs.sdl }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base: depth 2
      # holds both.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # `sdl`: SDL's patches, or the backend's build that applies them and pins SDL, changed, so
      # the suites for those patches run (the `sdl` job, and a step of the macOS test job).
      - name: Anything besides docs? Anything of SDL's?
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$DRAFT" = true ]; then
            echo "::notice::draft pull request: nothing was built; the full CI runs at gh pr ready"
            printf 'code=false\nsdl=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$QUEUE_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) printf 'code=true\nsdl=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A base that can't be fetched (a force push's old tip) builds everything.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null && ! git fetch --depth=1 origin "$base"; then
            printf 'code=true\nsdl=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assigned first, so a failing diff fails the job (and `ci-ok`) rather than reading as
          # "nothing changed".
          files=$(git diff --name-only "$base" HEAD)
          code=false
          sdl=false
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | doc/* | LICENSE*) ;;
              *) code=true; echo "builds: $f changed" ;;
            esac
            case "$f" in
              backend/patches/* | backend/build.zig | backend/build.zig.zon | .github/workflows/ci.yml)
                sdl=true; echo "SDL's suites: $f changed" ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sdl=$sdl" >> "$GITHUB_OUTPUT"

  # Every tracked .zig and .zon file as `zig fmt` writes it. Needs Zig and nothing else: no
  # dependencies, no cache, a few seconds.
  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: zig fmt --check
        run: bash scripts/check-fmt.sh
      - name: lint
        # Not `zig build lint`: the root build fetches the app's URL dependencies.
        run: zig run scripts/lint.zig
      - name: scripts/ci-known-failing (Windows' merge-group list)
        run: bash scripts/test-ci-known-failing.sh
      - name: scripts/zb (build lock)
        run: sh scripts/test-zb.sh
      - name: scripts/check-kickoff
        run: python3 scripts/test-check-kickoff.py
      - name: scripts/hello-numbers (harness, no windows)
        run: python3 scripts/test-hello-numbers.py
      - name: scripts/agent-prepare, agent-finish
        run: bash scripts/test-agent-work.sh
      - name: superfans (fan-dedupe, fan-route, fan-lint on seeded input)
        run: bash scripts/test-fan.sh
      - name: scripts/perf-compile (store)
        run: bash scripts/test-perf-compile.sh
      - name: scripts/runner-setup.sh (private-repo check)
        run: sh scripts/test-runner-setup.sh
      - name: scripts/runner-setup.ps1 (private-repo check, dry run under pwsh)
        run: sh scripts/test-runner-setup-windows.sh

  test:
    name: Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-15, name: macOS }
    runs-on: ${{ matrix.os }}
    # macOS runs 26 to 30 minutes on a healthy day; a slow run should not be a failed one.
    timeout-minutes: ${{ matrix.name == 'macOS' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
      # The Zig cache's key, worked out once, here, before anything is unpacked. The fetch below
      # unpacks every dependency into zig-pkg/, each with its own build.zig.zon, so a
      # `hashFiles('**/build.zig.zon')` evaluated after it names a hash no restore ever asked
      # for. A step output is fixed once set.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # The Zig cache is restored and saved by this job's own steps; see below.
          use-cache: false
      # setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at `.zig-cache`, the
      # directory cached here. Do NOT override those vars: pointing them elsewhere leaves the
      # cache empty, so every run re-downloads every dependency from codeload.github.com —
      # which is where `HttpConnectionClosing` comes from. (Zig 0.16 caches the downloaded
      # *tarballs* under $ZIG_GLOBAL_CACHE_DIR/p and unpacks them into the project-local
      # zig-pkg/; a cache hit still costs an unpack but no network.)
      #
      # A job's cache is one cold build, saved once; every later run with the same
      # dependencies, Zig and OS starts from it. setup-zig's own caching saved every run under
      # a new key and restored the newest, so a warm run saved what it restored plus everything
      # it rebuilt: Linux's grew from 3.7 GB to 6-7 GB in one run, passed the size limit, and
      # was cleared and saved empty, and the run after it started cold. Every other run on
      # main built from nothing, and the near-duplicates filled the repo's 10 GB. Here the key
      # is fixed and a key can't be overwritten, so only a run that restored nothing saves, and
      # only if it succeeded: a run cancelled or failed mid-build never leaves a partial cache
      # behind.
      #
      # A pull request that changes a `build.zig.zon` has a key main never saved, and used to
      # build cold on every push. It falls back to main's newest cache for the same job
      # (`restore-keys`, the key's prefix): Zig's cache is content-addressed, so what still
      # matches is reused and the rest is never read. It saves nothing then: a cache saved on top
      # of a restored one holds both, the growth described above. Main never falls back, so the
      # merge that changes a dependency builds it cold and saves a cache of only what it uses.
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      # Zig 0.16's HTTP client doesn't retry on `HttpConnectionClosing` from
      # GitHub. Pre-fetch all deps in a retry loop, separate from the build, so
      # the loop only re-runs the network step. After this step `zig build` runs
      # offline against the populated global cache. Note `--fetch=all` is NOT
      # usable here: it walks lazy deps of deps that this build never reaches
      # (old-format hashes, freetype's savannah tarball), and fails on them.
      #
      # This covers the *eager* tree only. A `.lazy = true` dependency is fetched by the build
      # step that first asks for it — `icons` is reached solely through `build/web.zig`'s
      # `lazyDependency`, so it is fetched from inside `zig build`, where this loop cannot help.
      # That is why the build steps below go through `scripts/ci-retry.sh`, which retries a
      # command only when its output names a fetch failure.
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      # Every test binary is compiled before any of them runs, so no compiler is alive beside a
      # running test. On Windows, Zig 0.16 spawns each child inheriting every inheritable handle
      # the build runner holds, the pipes it is making for its other children included. A
      # compiler spawned while a test's pipes exist keeps a copy of that test's stdout: the test
      # passes and exits, but its stdout reaches EOF only when the compiler exits, and the runner
      # gives up after a minute with "test runner failed to respond", on whichever tiny test was
      # unlucky, about one run in thirty. `check` is exactly the compiles `test` needs, so the
      # step after it spawns only test binaries, which live for milliseconds.
      - name: Compile tests
        shell: bash
        run: bash scripts/ci-retry.sh zig build check --summary all
      # The merge queue's known-failing wrapper on the awk it runs with there (Git Bash's).
      - name: scripts/ci-known-failing on Windows
        if: matrix.name == 'Windows'
        shell: bash
        run: bash scripts/test-ci-known-failing.sh
      - name: Run tests
        shell: bash
        # The step the hang is in, bounded on its own: the job's 30 minutes also cover a cold
        # cache, which a healthy run may spend most of before this step starts.
        timeout-minutes: 15
        # In the merge queue, Windows tolerates the intermittent failures listed in
        # `.github/known-failing-windows.txt`, which fail on main too and ejected passing PRs;
        # anything not listed, by binary and test name, still fails (scripts/ci-known-failing.sh).
        env:
          KNOWN_FAILING: ${{ github.event_name == 'merge_group' && matrix.name == 'Windows' && '.github/known-failing-windows.txt' || '' }}
        run: |
          if [ -n "$KNOWN_FAILING" ]; then
            bash scripts/ci-retry.sh bash scripts/ci-known-failing.sh "$KNOWN_FAILING" zig build test --summary all
          else
            bash scripts/ci-retry.sh zig build test --summary all
          fi

      # Not on Windows: the wasm it compiles is the same from any host, Linux and macOS compile it
      # too, and Windows is the matrix's longest job.
      - name: Fetch wasm dependencies (with retries)
        if: matrix.name != 'Windows'
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch -Dtarget=wasm32-freestanding

      - name: Compile web (wasm) build
        if: matrix.name != 'Windows'
        shell: bash
        run: |
          bash scripts/ci-retry.sh zig build web
          scripts/test-web-text-input.sh

      # The build above sets no `-Dapp-layout`, so its layout wiring is a no-op there; this
      # builds wasm with an app-owned `.zon` and `.zig` layout, and fails if that wiring is gone.
      - name: Compile web (wasm) build with a custom layout
        if: matrix.name != 'Windows'
        shell: bash
        # The script builds through scripts/zb, which waits for the load average to fall under the
        # performance cores. A runner's load is the previous step's compilers (16 against 3 on
        # macOS), so zb idled 10 minutes there. Nothing else shares a CI runner: skip the wait.
        env:
          FIZZY_BUILD_SKIP: "1"
        run: bash scripts/ci-retry.sh scripts/check-web-layout.sh

      # The tapes fizzyed.it serves beside the app: a script or `docs/demos/` tape that no longer
      # builds or reads back fails here, not on the deploy after merge.
      - name: Build the hosted demo tapes
        if: matrix.name != 'Windows'
        shell: bash
        run: bash scripts/ci-retry.sh zig build demos

      # Fizzy on dvui's own SDL3 backend (`-Dnative-backend=sdl3`), where any dvui app on the stock
      # backend stands: the platform pieces compile without fizzy's backend and lose what needs it
      # (floats' windows, the window skin). It rotted unnoticed while nothing built it. macOS
      # only: the platform reaches furthest into the backend there, and that is where it broke.
      - name: Fetch dependencies for dvui's SDL3 backend (with retries)
        if: matrix.name == 'macOS'
        run: bash scripts/ci-retry.sh zig build --fetch -Dnative-backend=sdl3
      - name: Compile on dvui's SDL3 backend
        if: matrix.name == 'macOS'
        run: bash scripts/ci-retry.sh zig build -Dnative-backend=sdl3 -Dno-emit --summary all

      # A link-only app (`-Ddynamic-plugins=false`): its gates on loading plugins at runtime are
      # comptime, so only a build with it off shows that build still compiles.
      - name: Compile a link-only app
        if: matrix.name == 'Linux'
        run: bash scripts/ci-retry.sh zig build -Ddynamic-plugins=false -Dno-emit --summary all

      # The suites for SDL's patches on macOS (FizzyGPU's Metal tests; the rest are Linux's), when
      # SDL's patches or pins changed: see the `sdl` job. Is there a Metal device? The probe says,
      # and the suite then requires Metal, so a runner with one can't skip the Metal tests. (On
      # macos-15, MTLCreateSystemDefaultDevice() is nil from a command-line tool though
      # MTLCopyAllDevices() lists the paravirtual GPU, and SDL's Metal driver works; hence the
      # list.)
      - name: Metal probe
        id: metal
        if: matrix.name == 'macOS' && needs.changes.outputs.sdl == 'true'
        run: |
          cat > "$RUNNER_TEMP/metal_probe.m" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void)
          {
              @autoreleasepool {
                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  NSArray<id<MTLDevice>> *all = MTLCopyAllDevices();
                  printf("MTLCreateSystemDefaultDevice: %s\n", device ? device.name.UTF8String : "nil");
                  printf("MTLCopyAllDevices: %lu\n", (unsigned long)all.count);
                  return all.count > 0 ? 0 : 1;
              }
          }
          EOF
          clang -fobjc-arc "$RUNNER_TEMP/metal_probe.m" -framework Foundation -framework Metal -o "$RUNNER_TEMP/metal_probe"
          if "$RUNNER_TEMP/metal_probe"; then
            echo "args=--require-gpu metal" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no Metal device"
          fi
      - name: Run the suites for SDL's patches
        if: matrix.name == 'macOS' && needs.changes.outputs.sdl == 'true'
        working-directory: backend
        run: bash ../scripts/ci-retry.sh zig build test-sdl --summary all -- ${{ steps.metal.outputs.args }}

      - name: Verify SDK version / ABI fingerprint lock
        shell: bash
        run: bash scripts/ci-retry.sh zig build test-sdk-version --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # Fizzy consumed from outside: fizzyedit/example-app (fizzy as a library, in every shape) and
  # fizzyedit/example-plugin (the plugin template), built against this tree fetched as a URL
  # dependency would be (`scripts/check-examples.sh`). The only checks that catch a path resolving
  # against the consumer's cwd instead of fizzy's build root (`.cwd_relative = "src/App.zig"`
  # once), or a file missing from `build.zig.zon`'s `.paths` (`VERSION`, `app/`) — both invisible
  # when fizzy builds itself. Linux only: neither bug is a platform's. A job of its own: its
  # eight builds of a tree that changes every commit were the Linux test job's six minutes,
  # and every run's longest step.
  examples:
    name: Example repos (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Build the example repos against this tree
        shell: bash
        run: bash scripts/ci-retry.sh bash scripts/check-examples.sh

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # The headless integration tests: real widgets, layouts and drags driven on dvui's testing
  # backend (no window, no GPU), plus the SDK, sizing and plugin-loader suites. The suite most
  # likely to catch a layout or drag regression, and until this job nothing ran it. Linux only:
  # the code under test is the same on every OS, and on Windows it needs MSVC (`build/app.zig`).
  # A job of its own beside the matrix, so it adds a compile to the run but not to its length.
  #
  # A test that logs a warning makes the build print `failed command: …fizzy-integration-tests`
  # while still passing (the demo-replay test always does): the exit code is the verdict, and the
  # Build Summary's `N/N steps succeeded` says the same.
  integration:
    name: Integration tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job: a fixed key, one cold build saved once.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Run integration tests
        shell: bash
        run: bash scripts/ci-retry.sh zig build test-integration --summary all
      # Every `test` block is in a test binary some step builds; one no root reaches compiles
      # nowhere, and the green run above says nothing about it. Reuses the binaries just built.
      - name: Every test is compiled
        shell: bash
        run: bash scripts/ci-retry.sh zig build check-tests-reached --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # A run of the real app that plays the soak tape to its end and exits with a verdict
  # (`src/editor/verdict.zig`, docs/AUTOMATION.md "A run that ends in a verdict"): no wait gave up,
  # SDL logged no error, the OS windows came back to one. Debug, so the debug allocator looks for
  # leaks at exit. On X11 under Xvfb, drawn by Mesa's Vulkan rasterizer (lavapipe), with floats in
  # OS windows of their own (`FIZZY_POPOUT=1`), as they are on macOS. The verdict and the backend's
  # counters are kept as an artifact.
  verdict:
    name: Verdict run (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job: a fixed key, one cold build saved once.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Install lavapipe and a headless display
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb xauth gdb \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxfixes3 libxss1 libxtst6 libxkbcommon0
          # The manifest's name moves between Mesa releases (lvp_icd.json, lvp_icd.x86_64.json).
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Build fizzy (Debug)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --summary all
      # Saved once the build is, not after the run: a verdict that fails still leaves the cache.
      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
      - name: Play the soak tape to a verdict
        shell: bash
        env:
          SDL_VIDEO_DRIVER: x11
          FIZZY_POPOUT: "1"
          FIZZY_DEMO: tests/tapes/soak.zon
          FIZZY_VERDICT: verdict/verdict.zon
          FIZZY_VERDICT_EXPECT: tests/tapes/soak.expect.zon
        run: |
          mkdir -p verdict
          xvfb-run -a -s "-screen 0 1280x1024x24" vulkaninfo --summary
          bin=$(ls zig-out/*/fizzy | head -n 1)
          xvfb-run -a -s "-screen 0 1280x1024x24" "$bin" --profile verdict/profile > verdict/fizzy.log 2>&1 &
          wrapper=$!
          # A run that hangs (on the way out, say) is given 10 minutes, then says where every
          # thread is before it is killed: a hang is a failure with a place, not just a timeout.
          for _ in $(seq 600); do kill -0 "$wrapper" 2>/dev/null || break; sleep 1; done
          if kill -0 "$wrapper" 2>/dev/null; then
            pid=$(pgrep -n -x fizzy)
            echo "fizzy (pid $pid) still running after 10 minutes; its threads:"
            sudo gdb -batch -p "$pid" -ex "thread apply all bt" > verdict/hang.txt 2>&1 || true
            grep -E "^Thread|^#" verdict/hang.txt | head -n 200 || true
            kill -9 "$pid" 2>/dev/null || true
          fi
          status=0
          wait "$wrapper" || status=$?
          grep -E "verdict|panic|error\(" verdict/fizzy.log | grep -v DebugAllocator | tail -n 40 || true
          echo "--- verdict.zon"
          cat verdict/verdict.zon || { echo "(no verdict written)"; status=1; }
          exit $status
      - name: Keep the verdict and the counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-linux
          path: |
            verdict/verdict.zon
            verdict/fizzy.log
            verdict/hang.txt
          if-no-files-found: warn

  # Fizzy's own backend on Windows — the default there too now (`build/exe.zig`'s
  # `defaultNativeBackend`) — which nothing else here builds: the consumer apps above run on Linux only.
  # Cross-compiled from Linux for the GNU ABI, which needs no MSVC SDK (release.yml's msvc
  # builds do). It shows the app compiles and links, not that it runs.
  windows-fizzy-backend:
    name: Windows build (fizzy backend, cross-compiled)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job. This job's key used to be worked out inline, so
      # setup-zig saved under a hash taken after the fetch had unpacked zig-pkg/ and every
      # restore missed.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: |
          prefix="zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-"
          echo "key=${prefix}${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then echo "fallback=$prefix" >> "$GITHUB_OUTPUT"; fi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
          restore-keys: ${{ steps.zig-cache-key.outputs.fallback }}
      - name: Pre-create Zig cache tmp/
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Build for x86_64-windows-gnu with -Dnative-backend=fizzy
        run: bash scripts/ci-retry.sh zig build -Dtarget=x86_64-windows-gnu -Dnative-backend=fizzy -Dno-emit --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # The suites for SDL's patches (`backend/patches/sdl`, docs/DEPENDENCIES.md) on Linux, run
  # only when SDL's patches or pins changed (`changes`' `sdl`); macOS runs its part in the test
  # job. Vulkan is Mesa's software driver, lavapipe; displays have no screen: Xvfb for X11,
  # headless weston for Wayland. No Zig cache: this job is rare, and a cold build of SDL costs
  # less than one more cache held against the repository's 10 GB.
  #
  # Ubuntu 26.04 runs every suite: FizzyGPU on X11 and on Wayland, FizzyWayland (frame insets,
  # read from libwayland's request trace) at output scale 1 and 2, and FizzyXkb. Ubuntu 24.04
  # runs FizzyXkb alone: SDL is built against libxkbcommon 1.13's headers, and 24.04's 1.6 lacks
  # `xkb_keymap_mod_get_mask` (1.10+), so there SDL's Wayland driver loads only through patch
  # 0009's fallback, which builds the modifier masks from their indices. FizzyXkb runs weston's
  # X11 backend inside Xvfb, not headless: the headless backend has no seat, and the X11 one has
  # a keyboard with the X server's layout (German, whose levels the suite checks).
  sdl:
    name: SDL patch suites (${{ matrix.distro }})
    needs: changes
    if: needs.changes.outputs.sdl == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: "ubuntu:26.04", all: true }
          - { distro: "ubuntu:24.04", all: false }
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    # A window test that hangs fails the job here, rather than after six hours.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Install tools, lavapipe, Xvfb and weston
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb xauth x11-xkb-utils x11-xserver-utils xkb-data weston \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxfixes3 libxss1 libxtst6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libdecor-0-0 \
            libegl1 libegl-mesa0 libgles2
          dpkg-query -W libxkbcommon0 libwayland-client0 mesa-vulkan-drivers weston
          # The manifest's name moves between Mesa releases (lvp_icd.json, lvp_icd.x86_64.json).
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Pre-create Zig cache tmp/
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Build the suites
        run: bash ../scripts/ci-retry.sh zig build test-sdl --summary all -- --list

      - name: Every suite on X11 (Xvfb)
        if: matrix.all
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" vulkaninfo --summary
          xvfb-run -a -s "-screen 0 1280x1024x24" zig build test-sdl --summary all -- --require-gpu vulkan

      # Lavapipe presents the frames that map the windows; Mesa's EGL (llvmpipe) draws for the test
      # that makes a window again for an OpenGL ES renderer. Weston's default desktop shell
      # maximizes and fullscreens. The insets are in window coordinates whatever the scale, so
      # FizzyWayland runs again at scale 2.
      - name: Every suite on Wayland (headless weston), FizzyWayland again at scale 2
        if: matrix.all
        env:
          SDL_VIDEO_DRIVER: wayland
          WAYLAND_DISPLAY: wayland-fizzy
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          status=0
          for scale in 1 2; do
            weston --backend=headless --scale=$scale --socket="$WAYLAND_DISPLAY" --idle-time=0 > "weston-$scale.log" 2>&1 &
            weston_pid=$!
            for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.1; done
            if [ $scale = 1 ]; then
              vulkaninfo --summary
              zig build test-sdl --summary all -- --require-gpu vulkan || status=$?
            else
              zig build test-sdl --summary all -- --filter FizzyWayland || status=$?
            fi
            kill "$weston_pid" || true
            wait "$weston_pid" || true
            echo "--- weston at scale $scale"
            cat "weston-$scale.log"
          done
          exit "$status"

      - name: FizzyXkb on Wayland (weston's X11 backend in Xvfb, German layout)
        env:
          DISPLAY: ":99"
          WAYLAND_DISPLAY: wayland-fizzy-xkb
          FIZZY_TEST_XKB_LAYOUT: de
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 -nolisten tcp -noreset &
          xvfb_pid=$!
          for i in $(seq 50); do xset q >/dev/null 2>&1 && break; sleep 0.1; done
          # Weston's X11 backend builds its keymap from the layout setxkbmap sets on the root
          # window. -noreset, or Xvfb resets the layout each time its last client disconnects.
          setxkbmap -layout de
          setxkbmap -query
          weston --backend=x11 --renderer=pixman --width=1024 --height=768 \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 &
          weston_pid=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.1; done
          status=0
          zig build test-sdl --summary all -- --filter FizzyXkb || status=$?
          kill "$weston_pid" "$xvfb_pid" || true
          exit "$status"

  # The required check. Drafts run only changes. Otherwise, every selected job must succeed;
  # only jobs deliberately excluded by the code/SDL filters may be skipped. Add each new job
  # to needs and to CODE_RESULTS or SDL_RESULT so the required check includes its result.
  ci-ok:
    name: ci-ok
    if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    needs: [changes, format, test, examples, integration, verdict, windows-fizzy-backend, sdl]
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SDL: ${{ needs.changes.outputs.sdl }}
          CODE_RESULTS: ${{ needs.format.result }} ${{ needs.test.result }} ${{ needs.examples.result }} ${{ needs.integration.result }} ${{ needs.verdict.result }} ${{ needs.windows-fizzy-backend.result }}
          SDL_RESULT: ${{ needs.sdl.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = success ]
          case "$CODE" in true) expected=success ;; false) expected=skipped ;; *) exit 1 ;; esac
          for r in $CODE_RESULTS; do
            echo "code job: $r (expected $expected)"
            [ "$r" = "$expected" ]
          done
          case "$SDL" in true) expected=success ;; false) expected=skipped ;; *) exit 1 ;; esac
          echo "SDL job: $SDL_RESULT (expected $expected)"
          [ "$SDL_RESULT" = "$expected" ]
