name: CI

# Every run, a push to main included: three native test jobs (no skipped rows) and the Windows
# cross-build.
#
# `ci-ok` is the one check `main`'s ruleset requires (`.github/rulesets/main.json`), so the
# workflow runs for every change. A workflow-level `paths-ignore` would never start for a
# Markdown-only PR, leaving its required check waiting for good; `changes` works out instead
# whether anything besides docs changed, and the builds skip themselves when nothing did.
#
# A push to main runs the full matrix because main's runs are the only ones whose Zig caches
# every pull request can restore: a cache a pull request saves is visible to that pull request
# alone (see the test job's "Restore Zig cache"). Pushes used to run only the Linux jobs, so main
# held no macOS, Windows or cross-build cache and every pull request's first run built those
# three cold. Now the merge that changes a dependency saves the new caches, a cache GitHub
# evicted after a quiet week comes back on the next merge, and every merge is tested on all
# three platforms. Nothing waits on a main run, and a cache hit makes the extra jobs short.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base: depth 2
      # holds both.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Anything besides docs?
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base=$QUEUE_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A base that can't be fetched (a force push's old tip) builds everything.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null && ! git fetch --depth=1 origin "$base"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assigned first, so a failing diff fails the job (and `ci-ok`) rather than reading as
          # "nothing changed".
          files=$(git diff --name-only "$base" HEAD)
          code=false
          while IFS= read -r f; do
            case "$f" in
              "" | *.md | doc/* | LICENSE*) ;;
              *) code=true; echo "builds: $f changed" ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-14, name: macOS }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Zig cache's key, worked out once, here, before anything is unpacked. The fetch below
      # unpacks every dependency into zig-pkg/, each with its own build.zig.zon, so a
      # `hashFiles('**/build.zig.zon')` evaluated after it names a hash no restore ever asked
      # for. A step output is fixed once set.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: echo "key=zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # The Zig cache is restored and saved by this job's own steps; see below.
          use-cache: false
      # setup-zig points ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR at `.zig-cache`, the
      # directory cached here. Do NOT override those vars: pointing them elsewhere leaves the
      # cache empty, so every run re-downloads every dependency from codeload.github.com —
      # which is where `HttpConnectionClosing` comes from. (Zig 0.16 caches the downloaded
      # *tarballs* under $ZIG_GLOBAL_CACHE_DIR/p and unpacks them into the project-local
      # zig-pkg/; a cache hit still costs an unpack but no network.)
      #
      # A job's cache is one cold build, saved once; every later run with the same
      # dependencies, Zig and OS starts from it. setup-zig's own caching saved every run under
      # a new key and restored the newest, so a warm run saved what it restored plus everything
      # it rebuilt: Linux's grew from 3.7 GB to 6-7 GB in one run, passed the size limit, and
      # was cleared and saved empty, and the run after it started cold. Every other run on
      # main built from nothing, and the near-duplicates filled the repo's 10 GB. Here the key
      # is fixed and a key can't be overwritten, so only a run that missed saves, and only if
      # it succeeded: a run cancelled or failed mid-build never leaves a partial cache behind.
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      # Zig 0.16's HTTP client doesn't retry on `HttpConnectionClosing` from
      # GitHub. Pre-fetch all deps in a retry loop, separate from the build, so
      # the loop only re-runs the network step. After this step `zig build` runs
      # offline against the populated global cache. Note `--fetch=all` is NOT
      # usable here: it walks lazy deps of deps that this build never reaches
      # (old-format hashes, freetype's savannah tarball), and fails on them.
      #
      # This covers the *eager* tree only. A `.lazy = true` dependency is fetched by the build
      # step that first asks for it — `icons` is reached solely through `build/web.zig`'s
      # `lazyDependency`, so it is fetched from inside `zig build`, where this loop cannot help.
      # That is why the build steps below go through `scripts/ci-retry.sh`, which retries a
      # command only when its output names a fetch failure.
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Run tests
        shell: bash
        run: bash scripts/ci-retry.sh zig build test --summary all

      - name: Fetch wasm dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch -Dtarget=wasm32-freestanding

      - name: Compile web (wasm) build
        shell: bash
        run: bash scripts/ci-retry.sh zig build check-web

      # Fizzy consumed as a library by an outside package. This is the only check that can
      # catch a path resolving against the consumer's cwd instead of fizzy's build root — the
      # exact bug that broke this (`.cwd_relative = "src/App.zig"`) is invisible when fizzy
      # builds itself, because then the two directories are the same. Linux only: that bug is no
      # platform's, and on macOS the four apps (each compiling its own SDL3) took most of the run.
      - name: Build external consumer apps (fizzy as a library)
        if: matrix.name == 'Linux'
        run: |
          for app in examples/hello-plugin examples/minimal-app examples/studio-app examples/endless-app examples/replay-app; do
            echo "::group::$app"
            # Each example is its own package and fetches its own copy of the tree, so each one
            # is another handful of chances to meet a closed connection.
            (cd "$app" && bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" zig build --summary all)
            echo "::endgroup::"
          done

      - name: Verify SDK version / ABI fingerprint lock
        shell: bash
        run: bash scripts/ci-retry.sh zig build test-sdk-version --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # The headless integration tests: real widgets, layouts and drags driven on dvui's testing
  # backend (no window, no GPU), plus the SDK, sizing and plugin-loader suites. The suite most
  # likely to catch a layout or drag regression, and until this job nothing ran it. Linux only:
  # the code under test is the same on every OS, and on Windows it needs MSVC (`build/app.zig`).
  # A job of its own beside the matrix, so it adds a compile to the run but not to its length.
  #
  # A test that logs a warning makes the build print `failed command: …fizzy-integration-tests`
  # while still passing (the demo-replay test always does): the exit code is the verdict, and the
  # Build Summary's `N/N steps succeeded` says the same.
  integration:
    name: Integration tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job: a fixed key, one cold build saved once.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: echo "key=zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Run integration tests
        shell: bash
        run: bash scripts/ci-retry.sh zig build test-integration --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # Fizzy's own backend on Windows — the default there too now (`build/exe.zig`'s
  # `defaultNativeBackend`) — which nothing else here builds: the consumer apps above run on Linux only.
  # Cross-compiled from Linux for the GNU ABI, which needs no MSVC SDK (release.yml's msvc
  # builds do). It shows the app compiles and links, not that it runs.
  windows-fizzy-backend:
    name: Windows build (fizzy backend, cross-compiled)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Zig cache as in the test job. This job's key used to be worked out inline, so
      # setup-zig saved under a hash taken after the fetch had unpacked zig-pkg/ and every
      # restore missed.
      - name: Zig cache key
        id: zig-cache-key
        shell: bash
        run: echo "key=zig-${{ env.ZIG_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/build.zig.zon') }}" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Restore Zig cache
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}
      - name: Pre-create Zig cache tmp/
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      - name: Fetch dependencies (with retries)
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Build for x86_64-windows-gnu with -Dnative-backend=fizzy
        run: bash scripts/ci-retry.sh zig build -Dtarget=x86_64-windows-gnu -Dnative-backend=fizzy -Dno-emit --summary all

      - name: Save Zig cache
        if: success() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache-key.outputs.key }}

  # The required check. Passes when every job above passed or was skipped (a docs-only change
  # skips the builds); fails on any failure or cancellation, `changes` included. A job added to
  # this workflow joins the gate by being added to `needs`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, test, integration, windows-fizzy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
