name: CI

# PR / manual: three native test jobs (no skipped rows). Push to main: Linux-only (fast).
on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "**.md"
      - "LICENSE**"
  pull_request:
    paths-ignore:
      - "doc/**"
      - "README.md"
      - "**.md"
      - "LICENSE**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'push' && fromJSON('[{"os":"ubuntu-latest","name":"Linux"}]') || fromJSON('[{"os":"ubuntu-latest","name":"Linux"},{"os":"windows-latest","name":"Windows"},{"os":"macos-14","name":"macOS"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ hashFiles('**/build.zig.zon') }}
      # setup-zig exports ZIG_GLOBAL_CACHE_DIR / ZIG_LOCAL_CACHE_DIR and caches that
      # directory across runs. Do NOT override those vars: pointing them elsewhere
      # leaves the action's cache empty, so every run re-downloads every dependency
      # from codeload.github.com — which is where `HttpConnectionClosing` comes from.
      # (Zig 0.16 caches the downloaded *tarballs* under $ZIG_GLOBAL_CACHE_DIR/p and
      # unpacks them into the project-local zig-pkg/; only the tarballs are cached,
      # so a cache hit still costs an unpack but no network.)
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
      # Zig 0.16's HTTP client doesn't retry on `HttpConnectionClosing` from
      # GitHub. Pre-fetch all deps in a retry loop, separate from the build, so
      # the loop only re-runs the network step. After this step `zig build` runs
      # offline against the populated global cache. Note `--fetch=all` is NOT
      # usable here: it walks lazy deps of deps that this build never reaches
      # (old-format hashes, freetype's savannah tarball), and fails on them.
      #
      # This covers the *eager* tree only. A `.lazy = true` dependency is fetched by the build
      # step that first asks for it — `icons` is reached solely through `build/web.zig`'s
      # `lazyDependency`, so it is fetched from inside `zig build`, where this loop cannot help.
      # That is why the build steps below go through `scripts/ci-retry.sh`, which retries a
      # command only when its output names a fetch failure.
      - name: Fetch dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch
      - name: Run tests
        shell: bash
        run: bash scripts/ci-retry.sh zig build test --summary all

      - name: Fetch wasm dependencies (with retries)
        shell: bash
        run: bash scripts/ci-retry.sh zig build --fetch -Dtarget=wasm32-freestanding

      - name: Compile web (wasm) build
        shell: bash
        run: bash scripts/ci-retry.sh zig build check-web

      # Fizzy consumed as a library by an outside package. This is the only check that can
      # catch a path resolving against the consumer's cwd instead of fizzy's build root — the
      # exact bug that broke this (`.cwd_relative = "src/App.zig"`) is invisible when fizzy
      # builds itself, because then the two directories are the same.
      - name: Build external consumer apps (fizzy as a library)
        if: matrix.name != 'Windows'
        run: |
          for app in examples/hello-plugin examples/minimal-app examples/studio-app examples/endless-app; do
            echo "::group::$app"
            # Each example is its own package and fetches its own copy of the tree, so each one
            # is another handful of chances to meet a closed connection.
            (cd "$app" && bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" zig build --summary all)
            echo "::endgroup::"
          done

      - name: Verify SDK version / ABI fingerprint lock
        shell: bash
        run: bash scripts/ci-retry.sh zig build test-sdk-version --summary all
